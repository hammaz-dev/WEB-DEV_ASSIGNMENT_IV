<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Connect</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78;
    --line: #d9e0e6; --accent: #0e6b5c; --accent-ink: #ffffff; --mine: #dff1ec;
    --danger: #a3262a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11181e; --panel: #19232b; --ink: #e8eef2; --muted: #93a3b0;
            --line: #2b3a45; --accent: #3fb59f; --accent-ink: #0b1a17; --mine: #1f3a35; --danger: #ef7478; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); min-height: 100vh; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--ink); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  #msg { min-height: 1.4em; margin-top: 12px; color: var(--danger); font-size: .9rem; }
  #chat { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar form { display: flex; gap: 8px; }
  .bar input { width: 140px; padding: 6px 10px; }
  .bar button { padding: 6px 12px; }
  #log { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .m { max-width: 80%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .m.me { align-self: flex-end; background: var(--mine); }
  .m b { display: block; font-size: .8rem; color: var(--muted); }
  .sys { align-self: center; color: var(--muted); font-size: .85rem; }
  #typing { height: 1.4em; color: var(--muted); font-size: .85rem; }
  #send { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Secure Connect</h1>
  <p class="sub">Sign in to chat in real time.</p>

  <section id="auth" class="panel">
    <label for="username">Username (sign up only)</label>
    <input id="username" autocomplete="username">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row">
      <button id="login">Log in</button>
      <button id="signup" class="ghost">Create account</button>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <section id="chat" class="panel">
    <div class="bar">
      <strong id="roomName">#general</strong>
      <form id="roomForm">
        <input id="room" placeholder="Room name" aria-label="Room name">
        <button class="ghost">Join room</button>
      </form>
      <button id="logout" class="ghost">Log out</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div id="typing"></div>
    <form id="send">
      <input id="text" placeholder="Write a message" aria-label="Message" autocomplete="off">
      <button>Send</button>
    </form>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let socket, me = '', room = 'general', typingTimer;

async function api(path, body) {
  const res = await fetch('/api/auth/' + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  return { ok: res.ok, data: await res.json() };
}

$('signup').onclick = async () => {
  const { ok, data } = await api('signup', {
    username: $('username').value, email: $('email').value, password: $('password').value });
  $('msg').textContent = ok ? 'Account created. You can log in now.' : data.message;
};

$('login').onclick = async () => {
  const { ok, data } = await api('login', { email: $('email').value, password: $('password').value });
  if (!ok) { $('msg').textContent = data.message; return; }
  me = JSON.parse(atob(data.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).username;
  startChat(data.token);
};

$('logout').onclick = () => { if (socket) socket.disconnect(); location.reload(); };

function add(cls, who, text) {
  const d = document.createElement('div');
  d.className = cls;
  if (who) { const b = document.createElement('b'); b.textContent = who; d.appendChild(b); }
  d.appendChild(document.createTextNode(text)); // textContent only: no HTML injection
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

function startChat(token) {
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => { $('msg').textContent = e.message; });
  socket.on('connect', () => { $('auth').style.display = 'none'; $('chat').style.display = 'block'; });
  socket.on('joinedRoom', (r) => { room = r; $('roomName').textContent = '#' + r; $('log').innerHTML = ''; });
  socket.on('history', ({ messages }) =>
    messages.forEach((m) => add(m.username === me ? 'm me' : 'm', m.username, m.text)));
  socket.on('chatMessage', (m) => { if (m.room === room) add(m.username === me ? 'm me' : 'm', m.username, m.text); });
  socket.on('systemMessage', (m) => { if (m.room === room) add('sys', '', m.text); });
  socket.on('typing', ({ room: r, username }) => {
    if (r !== room) return;
    $('typing').textContent = username + ' is typing...';
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => ($('typing').textContent = ''), 1200);
  });
}

$('send').onsubmit = (e) => {
  e.preventDefault();
  if (!$('text').value.trim()) return;
  socket.emit('chatMessage', { room, text: $('text').value });
  $('text').value = '';
};
$('text').oninput = () => socket && socket.emit('typing', room);
$('roomForm').onsubmit = (e) => {
  e.preventDefault();
  const r = $('room').value.trim();
  if (r) socket.emit('joinRoom', r);
  $('room').value = '';
};
</script>
</body>
</html>
